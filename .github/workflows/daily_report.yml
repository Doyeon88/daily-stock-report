name: Daily Stock Report

on:
  schedule:
    # tue-sat 06:30 KST (scripts/sync_schedule.py가 watchlist.json에서 만든 값)
    - cron: '30 21 * * 1,2,3,4,5'
  workflow_dispatch:  # 수동 실행 버튼

# 쓰기 권한은 상세 리포트(JSON)를 report-data 브랜치에 커밋하려고 필요하다 (notifications/report_publisher.py).
# 이 토큰은 main에도 쓸 수 있으므로 requirements.txt의 패키지는 믿을 수 있는 것만 유지할 것.
permissions:
  contents: write
  models: read   # GitHub Models로 기사 요약(ANTHROPIC_API_KEY가 없을 때의 대체 경로)

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily stock report
        # 지금 쓰는 Secret만 전달한다. 선택 항목은 Secret을 안 만들어 두면 빈 값이 되어 건너뛴다.
        env:
          # 서비스 계정 키 JSON 파일의 "내용 전체"를 Secret에 넣는다 (파일 경로 아님)
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
          # (선택) Finnhub 뉴스. 없으면 Google News RSS만 사용
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # (선택) SEC 직접 조회용 연락처 User-Agent, 영문 한 줄. 예: daily-stock-report YourName me@example.com
          # 없거나 SEC가 거절(러너 IP)하면 Yahoo Finance의 공시 목록으로 대체된다
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # 상세 리포트 저장용. GITHUB_REPOSITORY는 Actions가 자동으로 채운다
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # (선택) 내 보유 종목 JSON(portfolio.example.json 형식). 저장소가 공개라서 파일이 아니라 Secret으로만 넣는다.
          # 공개되는 리포트에는 수익률·비중(%)만 실리고 금액은 실리지 않는다(PORTFOLIO_PUBLISH_AMOUNTS=1일 때만 금액 포함)
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          # (선택) 기사 한국어 요약용 Anthropic API 키. 없으면 GitHub Models(위 GITHUB_TOKEN), 그것도 안 되면 기사 발췌문
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py
