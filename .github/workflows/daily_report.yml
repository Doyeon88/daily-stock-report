name: Daily Stock Report

on:
  schedule:
    # 화~토 오전 9시 KST (= 00:00 UTC): 미국장은 KST 새벽에 마감하므로
    # 월~금 장 마감 결과가 다음날 아침(금요일 장은 토요일 아침)에 도착한다
    - cron: '0 0 * * 2-6'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: read

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily stock report
        # 현재 구현된 수집·알림에 필요한 Secret만 전달한다.
        # 다른 수집기(뉴스, 재무 등)를 구현하면 해당 API 키 Secret을 여기에 추가한다.
        env:
          # 서비스 계정 키 JSON 파일의 "내용 전체"를 Secret에 넣는다 (파일 경로 아님)
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
        run: python main.py
