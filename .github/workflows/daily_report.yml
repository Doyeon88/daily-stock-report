name: Daily Stock Report

on:
  schedule:
    # 화~토 오전 9시 KST (= 00:00 UTC): 미국장은 KST 새벽에 마감하므로
    # 월~금 장 마감 결과가 다음날 아침(금요일 장은 토요일 아침)에 도착한다
    - cron: '0 0 * * 2-6'
  workflow_dispatch:  # 수동 실행 버튼

# 쓰기 권한은 상세 리포트(JSON)를 report-data 브랜치에 커밋하려고 필요하다 (notifications/report_publisher.py).
# 이 토큰은 main에도 쓸 수 있으므로 requirements.txt의 패키지는 믿을 수 있는 것만 유지할 것.
permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily stock report
        # 지금 쓰는 Secret만 전달한다. 선택 항목은 Secret을 안 만들어 두면 빈 값이 되어 건너뛴다.
        env:
          # 서비스 계정 키 JSON 파일의 "내용 전체"를 Secret에 넣는다 (파일 경로 아님)
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
          # (선택) Finnhub 뉴스. 없으면 Google News RSS만 사용
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # (선택) SEC가 요구하는 연락처 User-Agent, 영문 한 줄. 예: daily-stock-report YourName me@example.com
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # 상세 리포트 저장용. GITHUB_REPOSITORY는 Actions가 자동으로 채운다
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py
